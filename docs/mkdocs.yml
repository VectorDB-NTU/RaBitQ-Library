site_name: RaBitQ Library
site_description: Compact quantization and accurate vector search for C++ and Python
site_url: https://vectordb-ntu.github.io/RaBitQ-Library/
repo_url: https://github.com/VectorDB-NTU/RaBitQ-Library
repo_name: VectorDB-NTU/RaBitQ-Library
edit_uri: edit/main/docs/docs/
copyright: Copyright &copy; VectorDB Group, Nanyang Technological University

nav:
  - Home: index.md
  - Quick start: quick_start.md
  - Migrating to 0.8: python_migration.md
  - Installation: installation.md
  - C++ Integration: cpp_integration.md
  - Release notes:
      - "0.7.2": releases/0.7.2.md
      - "0.7.1": releases/0.7.1.md
      - "0.7.0": releases/0.7.0.md
      - "0.6.0": releases/0.6.0.md
  - RaBitQ:
      - Overview: rabitq/rabitq.md
      - Rotation: rabitq/rotator.md
      - Quantization: rabitq/quantizer.md
      - Stable core API: rabitq/core_api.md
      - Modular migration: modular_migration.md
      - Estimation: rabitq/estimator.md
      - Reranking: rabitq/reranking.md
      - Kernels:
          - Compact code storage: compact_code.md
          - Inner product: kernel_ip.md
  - Vector search:
      - Shared contracts: index/usage.md
      - IVF-RaBitQ: index/ivf.md
      - HNSW-RaBitQ: index/hnsw.md
      - SymphonyQG: index/qg.md
  - Integrations:
      - txtai: integrations/txtai.md
      - Zvec: integrations/zvec.md
  - Clustering: clustering.md
  - Papers and citations: papers.md
  - Benchmarks:
      - Overview: benchmarks/bench.md
      - IVF indexes: benchmarks/ivf.md
      - Graph indexes: benchmarks/graphs.md
      - K-means: benchmarks/kmeans.md

theme:
  name: material
  language: en
  font: false
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@2/MathJax.js?config=TeX-AMS-MML_HTMLorMML

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/VectorDB-NTU/RaBitQ-Library
      name: RaBitQ Library on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/rabitqlib/
      name: RaBitQ Library on PyPI
