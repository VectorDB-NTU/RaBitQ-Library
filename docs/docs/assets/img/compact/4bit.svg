<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc">
<title id="title">4-bit: pair coordinates eight positions apart</title><desc id="desc">Four-bit byte zero pairs codes zero and eight; five-bit low-part byte zero instead pairs zero and sixteen.</desc>
<g font-family="DejaVu Sans, sans-serif" fill="#172033">
<rect width="800" height="470" rx="12" fill="#ffffff"/>
<text x="24" y="35" font-size="23" text-anchor="start" font-weight="bold">4-bit: pair coordinates eight positions apart</text>
<text x="24" y="64" font-size="17" text-anchor="start" font-weight="normal">Each row is one byte. Left = bit 0 (LSB); right = bit 7 (MSB).</text>
<text x="24" y="117" font-size="17" text-anchor="start" font-weight="bold">4-bit byte 0</text>
<rect x="176" y="86" width="288" height="58" fill="#dbeafe" stroke="#64748b"/>
<text x="320.0" y="110" font-size="18" text-anchor="middle" font-weight="normal">c[0]</text>
<text x="320.0" y="132" font-size="14" text-anchor="middle" font-weight="normal">bits 0–3</text>
<rect x="464" y="86" width="288" height="58" fill="#dcfce7" stroke="#64748b"/>
<text x="608.0" y="110" font-size="18" text-anchor="middle" font-weight="normal">c[8]</text>
<text x="608.0" y="132" font-size="14" text-anchor="middle" font-weight="normal">bits 4–7</text>
<text x="24" y="183" font-size="17" text-anchor="start" font-weight="bold">4-bit byte 7</text>
<rect x="176" y="152" width="288" height="58" fill="#dbeafe" stroke="#64748b"/>
<text x="320.0" y="176" font-size="18" text-anchor="middle" font-weight="normal">c[7]</text>
<text x="320.0" y="198" font-size="14" text-anchor="middle" font-weight="normal">bits 0–3</text>
<rect x="464" y="152" width="288" height="58" fill="#dcfce7" stroke="#64748b"/>
<text x="608.0" y="176" font-size="18" text-anchor="middle" font-weight="normal">c[15]</text>
<text x="608.0" y="198" font-size="14" text-anchor="middle" font-weight="normal">bits 4–7</text>
<text x="24" y="249" font-size="17" text-anchor="start" font-weight="bold">4-bit byte 8</text>
<rect x="176" y="218" width="288" height="58" fill="#dbeafe" stroke="#64748b"/>
<text x="320.0" y="242" font-size="18" text-anchor="middle" font-weight="normal">c[16]</text>
<text x="320.0" y="264" font-size="14" text-anchor="middle" font-weight="normal">bits 0–3</text>
<rect x="464" y="218" width="288" height="58" fill="#dcfce7" stroke="#64748b"/>
<text x="608.0" y="242" font-size="18" text-anchor="middle" font-weight="normal">c[24]</text>
<text x="608.0" y="264" font-size="14" text-anchor="middle" font-weight="normal">bits 4–7</text>
<text x="24" y="315" font-size="17" text-anchor="start" font-weight="bold">4-bit byte 31</text>
<rect x="176" y="284" width="288" height="58" fill="#dbeafe" stroke="#64748b"/>
<text x="320.0" y="308" font-size="18" text-anchor="middle" font-weight="normal">c[55]</text>
<text x="320.0" y="330" font-size="14" text-anchor="middle" font-weight="normal">bits 0–3</text>
<rect x="464" y="284" width="288" height="58" fill="#dcfce7" stroke="#64748b"/>
<text x="608.0" y="308" font-size="18" text-anchor="middle" font-weight="normal">c[63]</text>
<text x="608.0" y="330" font-size="14" text-anchor="middle" font-weight="normal">bits 4–7</text>
<text x="24" y="375" font-size="17" text-anchor="start" font-weight="normal">Compare: the low-four-bit part of a 5-bit full block uses a different pairing.</text>
<text x="24" y="423" font-size="17" text-anchor="start" font-weight="bold">5-bit byte 0</text>
<rect x="176" y="392" width="288" height="58" fill="#dbeafe" stroke="#64748b"/>
<text x="320.0" y="416" font-size="18" text-anchor="middle" font-weight="normal">c[0] &amp; 15</text>
<text x="320.0" y="438" font-size="14" text-anchor="middle" font-weight="normal">bits 0–3</text>
<rect x="464" y="392" width="288" height="58" fill="#fef3c7" stroke="#64748b"/>
<text x="608.0" y="416" font-size="18" text-anchor="middle" font-weight="normal">c[16] &amp; 15</text>
<text x="608.0" y="438" font-size="14" text-anchor="middle" font-weight="normal">bits 4–7</text>
</g>
</svg>
