<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
<title id="title">2-bit: four codes in each byte</title><desc id="desc">Byte j stores coordinates j, 16+j, 32+j and 48+j in increasing bit order.</desc>
<g font-family="DejaVu Sans, sans-serif" fill="#172033">
<rect width="800" height="320" rx="12" fill="#ffffff"/>
<text x="24" y="35" font-size="23" text-anchor="start" font-weight="bold">2-bit: four codes in each byte</text>
<text x="24" y="64" font-size="17" text-anchor="start" font-weight="normal">Each row is one byte. Left = bit 0 (LSB); right = bit 7 (MSB).</text>
<text x="24" y="117" font-size="17" text-anchor="start" font-weight="bold">Byte 0</text>
<rect x="176" y="86" width="144" height="58" fill="#dbeafe" stroke="#64748b"/>
<text x="248.0" y="110" font-size="18" text-anchor="middle" font-weight="normal">c[0]</text>
<text x="248.0" y="132" font-size="14" text-anchor="middle" font-weight="normal">bits 0–1</text>
<rect x="320" y="86" width="144" height="58" fill="#dcfce7" stroke="#64748b"/>
<text x="392.0" y="110" font-size="18" text-anchor="middle" font-weight="normal">c[16]</text>
<text x="392.0" y="132" font-size="14" text-anchor="middle" font-weight="normal">bits 2–3</text>
<rect x="464" y="86" width="144" height="58" fill="#fef3c7" stroke="#64748b"/>
<text x="536.0" y="110" font-size="18" text-anchor="middle" font-weight="normal">c[32]</text>
<text x="536.0" y="132" font-size="14" text-anchor="middle" font-weight="normal">bits 4–5</text>
<rect x="608" y="86" width="144" height="58" fill="#fce7f3" stroke="#64748b"/>
<text x="680.0" y="110" font-size="18" text-anchor="middle" font-weight="normal">c[48]</text>
<text x="680.0" y="132" font-size="14" text-anchor="middle" font-weight="normal">bits 6–7</text>
<text x="24" y="185" font-size="17" text-anchor="start" font-weight="bold">Byte 1</text>
<rect x="176" y="154" width="144" height="58" fill="#dbeafe" stroke="#64748b"/>
<text x="248.0" y="178" font-size="18" text-anchor="middle" font-weight="normal">c[1]</text>
<text x="248.0" y="200" font-size="14" text-anchor="middle" font-weight="normal">bits 0–1</text>
<rect x="320" y="154" width="144" height="58" fill="#dcfce7" stroke="#64748b"/>
<text x="392.0" y="178" font-size="18" text-anchor="middle" font-weight="normal">c[17]</text>
<text x="392.0" y="200" font-size="14" text-anchor="middle" font-weight="normal">bits 2–3</text>
<rect x="464" y="154" width="144" height="58" fill="#fef3c7" stroke="#64748b"/>
<text x="536.0" y="178" font-size="18" text-anchor="middle" font-weight="normal">c[33]</text>
<text x="536.0" y="200" font-size="14" text-anchor="middle" font-weight="normal">bits 4–5</text>
<rect x="608" y="154" width="144" height="58" fill="#fce7f3" stroke="#64748b"/>
<text x="680.0" y="178" font-size="18" text-anchor="middle" font-weight="normal">c[49]</text>
<text x="680.0" y="200" font-size="14" text-anchor="middle" font-weight="normal">bits 6–7</text>
<text x="24" y="253" font-size="17" text-anchor="start" font-weight="bold">Byte 15</text>
<rect x="176" y="222" width="144" height="58" fill="#dbeafe" stroke="#64748b"/>
<text x="248.0" y="246" font-size="18" text-anchor="middle" font-weight="normal">c[15]</text>
<text x="248.0" y="268" font-size="14" text-anchor="middle" font-weight="normal">bits 0–1</text>
<rect x="320" y="222" width="144" height="58" fill="#dcfce7" stroke="#64748b"/>
<text x="392.0" y="246" font-size="18" text-anchor="middle" font-weight="normal">c[31]</text>
<text x="392.0" y="268" font-size="14" text-anchor="middle" font-weight="normal">bits 2–3</text>
<rect x="464" y="222" width="144" height="58" fill="#fef3c7" stroke="#64748b"/>
<text x="536.0" y="246" font-size="18" text-anchor="middle" font-weight="normal">c[47]</text>
<text x="536.0" y="268" font-size="14" text-anchor="middle" font-weight="normal">bits 4–5</text>
<rect x="608" y="222" width="144" height="58" fill="#fce7f3" stroke="#64748b"/>
<text x="680.0" y="246" font-size="18" text-anchor="middle" font-weight="normal">c[63]</text>
<text x="680.0" y="268" font-size="14" text-anchor="middle" font-weight="normal">bits 6–7</text>
<text x="24" y="305" font-size="16" text-anchor="start" font-weight="normal">Full block: 64 coordinates → 16 bytes. Intermediate rows follow the same rule.</text>
</g>
</svg>
