name: Release wheels

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Test", "Python Wheel"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  prepare:
    name: Check release eligibility
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Determine release version and check CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/prepare_release.py

  linux-wheels:
    name: Linux x86-64 wheels
    needs: [prepare, changes]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.build == 'true' &&
      (needs.changes.result != 'success' || needs.changes.outputs.wheels == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build and test PR wheel
        if: github.event_name == 'pull_request'
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp311-manylinux_x86_64
        with:
          output-dir: wheelhouse

      - name: Build and test release wheels
        if: github.event_name != 'pull_request'
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: wheelhouse

      - name: Store wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  release-tag:
    name: Create version tag
    needs: [prepare, linux-wheels]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_run') &&
      needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Create tag at the tested commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  pypi-publish:
    name: Publish wheels to PyPI
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_run') &&
      needs.prepare.outputs.publish == 'true'
    needs: [prepare, linux-wheels, release-tag]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rabitqlib/
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-wheels
          path: wheelhouse

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          skip-existing: true

  github-release:
    name: Create GitHub release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_run') &&
      needs.prepare.outputs.publish == 'true'
    needs: [prepare, linux-wheels, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-wheels
          path: wheelhouse

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" wheelhouse/*.whl --generate-notes --verify-tag
          fi
