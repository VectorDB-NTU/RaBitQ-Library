name: Release wheels

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Test", "Python Wheel"]
    types: [completed]
    branches: ["main"]

concurrency:
  group: release-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  prepare:
    name: Check release eligibility
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Determine release version and check CI
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/prepare_release.py

  linux-wheel-build:
    name: Linux x86-64 wheel builds
    needs: [prepare, changes]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.build == 'true' &&
      (needs.changes.result != 'success' || needs.changes.outputs.wheels == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp311-manylinux_x86_64 cp314-manylinux_x86_64' || 'cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64' }}
        with:
          output-dir: wheelhouse
      - name: Store wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  linux-wheels:
    # Preserve the required check name and include every selected ABI. The gate
    # always runs: a skipped build passes only when nothing selected it, never
    # because the eligibility check failed.
    name: Linux x86-64 wheels
    needs: [prepare, changes, linux-wheel-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected wheels
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_SELECTED: ${{ needs.prepare.outputs.build }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WHEELS_SELECTED: ${{ needs.changes.outputs.wheels }}
          BUILD_RESULT: ${{ needs.linux-wheel-build.result }}
        run: |
          if [ "$BUILD_RESULT" = success ]; then
            exit 0
          fi
          if [ "$BUILD_RESULT" != skipped ]; then
            exit 1
          fi
          # A skipped build passes when the eligibility check excluded this run,
          # ran and selected no build, or a pull request changed nothing
          # wheel-related. A failed eligibility check keeps the gate red.
          if [ "$PREPARE_RESULT" = skipped ]; then
            exit 0
          fi
          if [ "$PREPARE_RESULT" = success ] && [ "$BUILD_SELECTED" = false ]; then
            exit 0
          fi
          if [ "$PREPARE_RESULT" = success ] && [ "$CHANGES_RESULT" = success ] &&
             [ "$WHEELS_SELECTED" = false ]; then
            exit 0
          fi
          exit 1

  linux-arm64-wheel-build:
    name: Linux ARM64 wheel builds
    needs: [prepare, changes]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.build == 'true' &&
      (needs.changes.result != 'success' || needs.changes.outputs.wheels == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify native ARM64 runner
        run: test "$(uname -m)" = aarch64
      - name: Build and test repaired wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp311-manylinux_aarch64 cp314-manylinux_aarch64' || 'cp311-manylinux_aarch64 cp312-manylinux_aarch64 cp313-manylinux_aarch64 cp314-manylinux_aarch64' }}
        with:
          output-dir: wheelhouse
      - name: Store wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  linux-arm64-wheels:
    name: Linux ARM64 wheels (CPython 3.11–3.14)
    needs: [prepare, changes, linux-arm64-wheel-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected wheels
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_SELECTED: ${{ needs.prepare.outputs.build }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WHEELS_SELECTED: ${{ needs.changes.outputs.wheels }}
          BUILD_RESULT: ${{ needs.linux-arm64-wheel-build.result }}
        run: |
          if [ "$BUILD_RESULT" = success ]; then
            exit 0
          fi
          if [ "$BUILD_RESULT" != skipped ]; then
            exit 1
          fi
          # A skipped build passes when the eligibility check excluded this run,
          # ran and selected no build, or a pull request changed nothing
          # wheel-related. A failed eligibility check keeps the gate red.
          if [ "$PREPARE_RESULT" = skipped ]; then
            exit 0
          fi
          if [ "$PREPARE_RESULT" = success ] && [ "$BUILD_SELECTED" = false ]; then
            exit 0
          fi
          if [ "$PREPARE_RESULT" = success ] && [ "$CHANGES_RESULT" = success ] &&
             [ "$WHEELS_SELECTED" = false ]; then
            exit 0
          fi
          exit 1

  windows-wheel-build:
    # Windows wheels take longest, so each ABI builds on its own runner.
    name: Windows x86-64 wheel build (${{ matrix.abi }})
    needs: [prepare, changes]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.build == 'true' &&
      (needs.changes.result != 'success' || needs.changes.outputs.wheels == 'true')
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(github.event_name == 'pull_request' && '["cp311", "cp314"]' || '["cp311", "cp312", "cp313", "cp314"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ matrix.abi }}-win_amd64
        with:
          output-dir: wheelhouse
      - name: Store wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-wheels-${{ matrix.abi }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  windows-wheels:
    name: Windows x86-64 wheels
    needs: [prepare, changes, windows-wheel-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected wheels
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_SELECTED: ${{ needs.prepare.outputs.build }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WHEELS_SELECTED: ${{ needs.changes.outputs.wheels }}
          BUILD_RESULT: ${{ needs.windows-wheel-build.result }}
        run: |
          if [ "$BUILD_RESULT" = success ]; then
            exit 0
          fi
          if [ "$BUILD_RESULT" != skipped ]; then
            exit 1
          fi
          # A skipped build passes when the eligibility check excluded this run,
          # ran and selected no build, or a pull request changed nothing
          # wheel-related. A failed eligibility check keeps the gate red.
          if [ "$PREPARE_RESULT" = skipped ]; then
            exit 0
          fi
          if [ "$PREPARE_RESULT" = success ] && [ "$BUILD_SELECTED" = false ]; then
            exit 0
          fi
          if [ "$PREPARE_RESULT" = success ] && [ "$CHANGES_RESULT" = success ] &&
             [ "$WHEELS_SELECTED" = false ]; then
            exit 0
          fi
          exit 1

  macos-wheel-build:
    name: macOS arm64 wheel builds
    needs: [prepare, changes]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.build == 'true' &&
      (needs.changes.result != 'success' || needs.changes.outputs.wheels == 'true')
    runs-on: macos-15
    timeout-minutes: 90
    # Share one runner and one before-all OpenMP build across the selected ABIs.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build and test wheels with bundled OpenMP
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp311-macosx_arm64 cp314-macosx_arm64' || 'cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64 cp314-macosx_arm64' }}
        with:
          output-dir: wheelhouse
      - name: Store wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error

  macos-wheels:
    # Preserve the protected check name; PRs test the oldest and newest ABI.
    name: macOS arm64 wheels (CPython 3.11–3.14)
    needs: [prepare, changes, macos-wheel-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected wheels
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_SELECTED: ${{ needs.prepare.outputs.build }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          WHEELS_SELECTED: ${{ needs.changes.outputs.wheels }}
          BUILD_RESULT: ${{ needs.macos-wheel-build.result }}
        run: |
          if [ "$BUILD_RESULT" = success ]; then
            exit 0
          fi
          if [ "$BUILD_RESULT" != skipped ]; then
            exit 1
          fi
          # A skipped build passes when the eligibility check excluded this run,
          # ran and selected no build, or a pull request changed nothing
          # wheel-related. A failed eligibility check keeps the gate red.
          if [ "$PREPARE_RESULT" = skipped ]; then
            exit 0
          fi
          if [ "$PREPARE_RESULT" = success ] && [ "$BUILD_SELECTED" = false ]; then
            exit 0
          fi
          if [ "$PREPARE_RESULT" = success ] && [ "$CHANGES_RESULT" = success ] &&
             [ "$WHEELS_SELECTED" = false ]; then
            exit 0
          fi
          exit 1

  release-tag:
    name: Create version tag
    needs: [prepare, linux-wheels, linux-arm64-wheels, windows-wheels, macos-wheels]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_run') &&
      needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Create tag at the tested commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  pypi-publish:
    name: Publish wheels to PyPI
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_run') &&
      needs.prepare.outputs.publish == 'true'
    needs: [prepare, linux-wheels, linux-arm64-wheels, windows-wheels, macos-wheels, release-tag]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rabitqlib/
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-wheels*'
          path: wheelhouse
          merge-multiple: true

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse
          skip-existing: true

  github-release:
    name: Create GitHub release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_run') &&
      needs.prepare.outputs.publish == 'true'
    needs: [prepare, linux-wheels, linux-arm64-wheels, windows-wheels, macos-wheels, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-wheels*'
          path: wheelhouse
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" wheelhouse/*.whl --generate-notes --verify-tag
          fi
