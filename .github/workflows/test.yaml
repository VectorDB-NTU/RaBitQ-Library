name: Test
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  format:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp_format == 'true') }}
    name: C++ formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-15
      - name: Check formatting
        run: ./scripts/check-format.sh

  clang-tidy-shard:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp_tidy == 'true') }}
    name: C++ static analysis shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      TIDY_SHARD_INDEX: ${{ matrix.shard }}
      TIDY_SHARD_COUNT: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-tidy-15 libomp-15-dev cmake ninja-build
          python -m pip install "numpy>=1.23" "pybind11>=2.12"
      - name: Locate pybind11
        run: echo "pybind11_DIR=$(python -m pybind11 --cmakedir)" >> "$GITHUB_ENV"
      - name: Configure compilation database
        run: >-
          cmake -S . -B build-tidy -G Ninja
          -DRABITQ_BUILD_SAMPLES=OFF
          -DRABITQ_BUILD_TESTS=OFF
          -DRABITQ_BUILD_PYTHON_BINDINGS=ON
          -DCMAKE_BUILD_TYPE=Release
          -Dpybind11_DIR="$pybind11_DIR"
      - name: Run clang-tidy
        run: ./scripts/check-tidy.sh build-tidy

  clang-tidy:
    name: C++ static analysis
    needs: clang-tidy-shard
    if: ${{ always() && !cancelled() && needs.clang-tidy-shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both shards
        env:
          BUILD_RESULT: ${{ needs.clang-tidy-shard.result }}
        run: test "$BUILD_RESULT" = success

  shellcheck:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.shell == 'true') }}
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
      - name: Check scripts
        run: shellcheck scripts/*.sh

  ubuntu:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    name: Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DRABITQ_BUILD_TESTS=ON -DRABITQ_BUILD_SAMPLES=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      # The installed-consumer job runs the full portable Release suite.
      - name: Test native build smoke coverage
        run: >-
          ctest --test-dir build --output-on-failure --no-tests=error
          -R 'MatrixDispatchTest|FloatDistance|FastScan|QGKMeansTest.TrainsAndReturnsAssignmentsForFinalCentroids|RaBitQKMeansTest.FinalModesKeepFlatLloydAssignmentsAcrossClusterCounts'
      - name: Install example test dependencies
        run: python -m pip install numpy pytest
      - name: Test C++ examples
        env:
          RABITQ_REQUIRE_CPP_EXAMPLES: "1"
        run: python -m pytest tests/python/test_cpp_clustering_examples.py --tb=short -q

  windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    name: Windows x86-64 (VS 2026)
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B build-windows -G "Visual Studio 18 2026" -A x64
          -DRABITQ_BUILD_TESTS=ON
          -DRABITQ_ENABLE_NATIVE_OPTIMIZATION=OFF
      - name: Build
        run: cmake --build build-windows --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-windows -C Release --output-on-failure

  sanitizers:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    name: ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build
      # Keep assertions/debug symbols while avoiding unoptimized sanitizer loops.
      - name: Configure
        run: >-
          cmake -S . -B build-sanitizers -G Ninja
          -DRABITQ_BUILD_SAMPLES=OFF
          -DRABITQ_BUILD_TESTS=ON
          -DRABITQ_ENABLE_NATIVE_OPTIMIZATION=OFF
          -DRABITQ_ENABLE_SANITIZERS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS_DEBUG="-O1 -g -fno-optimize-sibling-calls"
      - name: Build
        run: cmake --build build-sanitizers
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitizers --output-on-failure

  downstream-consumer:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    name: Installed CMake consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build
      - name: Build RaBitQ-Library with portable tests
        run: |
          cmake -S . -B build-install -G Ninja \
            -DRABITQ_BUILD_SAMPLES=OFF \
            -DRABITQ_BUILD_TESTS=ON \
            -DRABITQ_ENABLE_NATIVE_OPTIMIZATION=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/rabitqlib-install"
          cmake --build build-install
      - name: Test portable Release build
        run: ctest --test-dir build-install --output-on-failure
      - name: Download pinned Intel SDE
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz \
            -o "$RUNNER_TEMP/sde.tar.xz"
          echo "94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50  $RUNNER_TEMP/sde.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1
      - name: Test AVX2-only and AVX-512 dispatch under emulation
        env:
          OMP_NUM_THREADS: "2"
        run: |
          simd_filter='CpuFeatures.*:FloatDistance.*:MatrixDispatchTest.*:FastScan*.*:BatchEstimatorTest.*'
          simd_filter+=':FhtDispatchTest.*:FlipSignTest.*:KacsWalkTest.*:ExcodeIp.*:MaskIpX0Q.*'
          simd_filter+=':PortableKernels.*:QueryPreparation.*:ScalarQuantize.*:WarmupIpX0Q.*:PackBinary.*'
          simd_filter+=':ExplicitSimd/RabitqRescaleBackendTest.*:QGEstimatorTest.*'
          simd_filter+=':QGKMeansTest.TrainsAndReturnsAssignmentsForFinalCentroids'
          simd_filter+=':RaBitQKMeansTest.FinalModesKeepFlatLloydAssignmentsAcrossClusterCounts'
          simd_filter+=':IvfPersistenceTest.ReloadsRawAndQuantizedStorage'
          simd_filter+=':HnswSaveTest.SuccessfulSavePreservesSearchAfterLoading'
          simd_filter+=':IvfAddTest.*:IvfRemoveTest.*'
          for cpu_model in hsw icl; do
            RABITQ_TEST_CPU="$cpu_model" "$RUNNER_TEMP/sde/sde64" "-$cpu_model" -- \
              build-install/tests/rabitq_tests --gtest_filter="$simd_filter"
          done
      - name: Install RaBitQ-Library
        run: cmake --install build-install
      - name: Build downstream consumer
        run: |
          cmake -S tests/consumer -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/rabitqlib-install"
          cmake --build build-consumer
      - name: Test downstream consumer
        run: ctest --test-dir build-consumer --output-on-failure

  linux-arm64:
    name: Native Linux ARM64 C++
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build
      - name: Configure portable ARM64 build
        run: |
          test "$(uname -m)" = aarch64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRABITQ_BUILD_TESTS=ON -DRABITQ_BUILD_SAMPLES=OFF \
            -DRABITQ_ENABLE_NATIVE_OPTIMIZATION=OFF
          ! grep -E -- '-mavx|_avx[25].*\.cpp' build/compile_commands.json
      - name: Build and run C++ tests
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Test installed CMake package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/rabitq-install"
          cmake -S tests/consumer -B build-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/rabitq-install"
          cmake --build build-consumer --parallel 2
          ctest --test-dir build-consumer --output-on-failure

  macos-arm64:
    name: Native Apple Silicon C++
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    runs-on: macos-14
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools and existing OpenMP dependency
        run: brew install cmake ninja libomp
      - name: Configure portable ARM64 source groups
        run: |
          test "$(uname -m)" = arm64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRABITQ_BUILD_TESTS=ON -DRABITQ_BUILD_SAMPLES=OFF \
            -DRABITQ_ENABLE_NATIVE_OPTIMIZATION=OFF \
            -DOpenMP_ROOT="$(brew --prefix libomp)"
          ! grep -E -- '-mavx|_avx[25].*\.cpp' build/compile_commands.json
      - name: Build and run C++ reference and index tests
        run: |
          cmake --build build --parallel 3
          ctest --test-dir build --output-on-failure
      - name: Test installed CMake package
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/rabitq-install"
          cmake -S tests/consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/rabitq-install" \
            -DOpenMP_ROOT="$(brew --prefix libomp)"
          cmake --build build-consumer --parallel 3
          ctest --test-dir build-consumer --output-on-failure
