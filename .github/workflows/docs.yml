name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs == 'true') }}
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict --config-file docs/mkdocs.yml

  docs-result:
    name: Documentation validation
    needs: [changes, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected documentation build
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_SELECTED: ${{ needs.changes.outputs.docs }}
          MATRIX_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$CHANGES_RESULT" = success ] && [ "$DOCS_SELECTED" = false ]; then
            test "$MATRIX_RESULT" = skipped || test "$MATRIX_RESULT" = success
          else
            test "$MATRIX_RESULT" = success
          fi

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --config-file docs/mkdocs.yml
