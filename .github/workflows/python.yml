name: Python Wheel

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  python-quality:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python_quality == 'true') }}
    name: Python formatting and linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.1"
      - name: Check Python
        run: ./scripts/check-python.sh
      - name: Check release automation
        run: |
          ruff format --check .github/scripts
          ruff check .github/scripts
          python -m unittest discover -s .github/scripts -p 'test_*.py'


  python-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python_build == 'true') }}
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Build and install wheel
        run: pip install ".[test]" -v

      # Repaired-wheel jobs run the full Python suite.
      - name: Smoke-test source installation
        run: >-
          python -m pytest --tb=short -q
          tests/python/test_import.py
          tests/python/test_ivf.py::test_save_load_roundtrip
          tests/python/test_hnsw.py::test_save_load_roundtrip
          tests/python/test_symqg.py::test_save_load_roundtrip
          tests/python/test_qgkmeans.py::test_train_populates_faiss_style_outputs
          tests/python/test_rabitqkmeans.py::test_flat_parameters_and_outputs

  python-windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python_build == 'true') }}
    name: Python Windows x86-64 (VS 2026)
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and install package
        run: python -m pip install ".[test]" -v
      - name: Smoke-test source installation
        run: >-
          python -m pytest --tb=short -q
          tests/python/test_import.py
          tests/python/test_ivf.py::test_save_load_roundtrip
          tests/python/test_hnsw.py::test_save_load_roundtrip
          tests/python/test_symqg.py::test_save_load_roundtrip
          tests/python/test_qgkmeans.py::test_train_populates_faiss_style_outputs
          tests/python/test_rabitqkmeans.py::test_flat_parameters_and_outputs

  faiss-comparison:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python_build == 'true') }}
    name: FAISS comparison script
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake
      - name: Install comparison dependencies
        run: python -m pip install ".[test]" faiss-cpu
      - name: Test comparison script
        run: python -m pytest tests/python/test_compare_with_faiss.py --tb=short -q
