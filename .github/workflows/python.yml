name: Python Wheel

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  python-quality:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python_quality == 'true') }}
    name: Python formatting and linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.1"
      - name: Check Python
        run: ./scripts/check-python.sh
      - name: Check release automation
        run: |
          ruff format --check .github/scripts
          ruff check .github/scripts
          python -m unittest discover -s .github/scripts -p 'test_*.py'


  python-build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python_build == 'true') }}
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Build and install wheel
        run: pip install ".[test]" -v

      - name: Run pytest
        run: pytest --tb=short -q

  python-windows:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.python_build == 'true') }}
    name: Python Windows x86-64 (VS 2026)
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build and install package
        run: python -m pip install ".[test]" -v
      - name: Test Python bindings
        run: python -m pytest tests/python --tb=short -q
