[build-system]
requires = ["scikit-build-core>=0.10.0", "pybind11>=2.12", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "rabitqlib"
version = "0.2.0"
description = "RaBitQ Python bindings for HNSW, IVF, and SymQG"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest>=7", "numpy"]

[tool.scikit-build]
# Disable directory auto-discovery so we can map it via CMake's install target
wheel.packages = []

# Pass the toggle to your root CMake file automatically on pip install
cmake.args = [
    "-DRABITQ_BUILD_PYTHON_BINDINGS=ON",
    "-DCMAKE_BUILD_TYPE=Release"
]

[tool.cibuildwheel]
build = "cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
build-verbosity = 1
environment = { CMAKE_ARGS = "-DRABITQ_ENABLE_NATIVE_OPTIMIZATION=OFF" }
test-requires = "pytest"
test-command = "pytest {project}/tests/python --tb=short -q"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
