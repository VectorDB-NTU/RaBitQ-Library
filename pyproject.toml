[build-system]
requires = ["scikit-build-core>=0.10.0", "pybind11>=2.12", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "rabitqlib"
version = "0.3.9"
description = "RaBitQ Python bindings for HNSW, IVF, and SymQG"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://vectordb-ntu.github.io/RaBitQ-Library/"
Documentation = "https://vectordb-ntu.github.io/RaBitQ-Library/"
Repository = "https://github.com/VectorDB-NTU/RaBitQ-Library"
Issues = "https://github.com/VectorDB-NTU/RaBitQ-Library/issues"
Paper = "https://doi.org/10.1145/3725413"

[project.optional-dependencies]
test = ["pytest>=7", "numpy"]

[tool.scikit-build]
# Disable directory auto-discovery so we can map it via CMake's install target
wheel.packages = []

# Python packages need the extension and core library, not C++ sample executables.
cmake.args = [
    "-DRABITQ_BUILD_PYTHON_BINDINGS=ON",
    "-DRABITQ_BUILD_SAMPLES=OFF",
    "-DCMAKE_BUILD_TYPE=Release"
]

[tool.cibuildwheel]
build = "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64 cp311-win_amd64 cp312-win_amd64 cp313-win_amd64 cp314-win_amd64 cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64 cp314-macosx_arm64"
build-verbosity = 1
environment = { CMAKE_ARGS = "-DRABITQ_ENABLE_NATIVE_OPTIMIZATION=OFF" }
test-requires = ["pytest", "faiss-cpu"]
test-command = "pytest {project}/tests/python --tb=short -q"

[tool.cibuildwheel.macos]
archs = ["arm64"]
before-all = "brew install libomp"
environment = { CMAKE_ARGS = "-DRABITQ_ENABLE_NATIVE_OPTIMIZATION=OFF -DOpenMP_ROOT=$(brew --prefix libomp)", MACOSX_DEPLOYMENT_TARGET = "14.0" }
repair-wheel-command = "delocate-wheel --require-archs arm64 -w {dest_dir} -v {wheel}"
test-environment = { RABITQ_TEST_WHEEL = "1", OMP_NUM_THREADS = "2" }

[tool.cibuildwheel.windows]
before-build = "python -m pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
